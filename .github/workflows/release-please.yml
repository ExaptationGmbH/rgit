name: release-please

# Conventional-commit driven releases. On every push to main, release-please
# maintains a "release PR" that accumulates changes and bumps the version /
# CHANGELOG. Merging that PR tags the release (vX.Y.Z) and publishes a GitHub
# Release. A follow-up job then pins the Homebrew formula to the new tarball.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Uses release-please-config.json + .release-please-manifest.json.
          token: ${{ secrets.GITHUB_TOKEN }}

  # After a release is cut, compute the tarball sha256 and pin Formula/rgit.rb.
  pin-formula:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin formula to ${{ needs.release-please.outputs.tag_name }}
        run: |
          chmod +x scripts/update-formula.sh
          ./scripts/update-formula.sh "${{ needs.release-please.outputs.tag_name }}"
      - name: Commit pinned formula
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Formula/rgit.rb; then
            git add Formula/rgit.rb
            git commit -m "chore: pin homebrew formula to ${{ needs.release-please.outputs.tag_name }}"
            git push
          else
            echo "Formula already up to date."
          fi
