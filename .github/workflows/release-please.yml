name: release-please

# Conventional-commit driven releases. On every push to main, release-please
# maintains a "release PR" that bumps the version / CHANGELOG. Merging it tags
# the release (vX.Y.Z), publishes a GitHub Release, and attaches cross-compiled
# binaries. The Homebrew formula lives in ExaptationGmbH/homebrew-tap, which
# polls this repo and bumps itself — nothing here touches the tap.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT (secret RELEASE_PLEASE) lets the release PR trigger CI;
          # falls back to GITHUB_TOKEN when it isn't set.
          token: ${{ secrets.RELEASE_PLEASE || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Manifest mode only needs the latest release; keep the scan shallow.
          release-search-depth: 5

  # Cross-compile binaries and attach them to the GitHub Release. The tap's
  # bump workflow downloads these exact asset names to compute sha256s.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          out="rgit-${TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" .
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$OUT" --clobber
